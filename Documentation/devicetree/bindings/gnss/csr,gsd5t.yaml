%YAML 1.2
---
$id: http://devicetree.org/schemas/gnss/csr,gsd5t.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: CSR GSD5T GNSS Receiver

maintainers:
  - Svyatoslav Ryhel <clamor95@gmail.com>

description:
  CSR-based GNSS receiver which uses a serial interface.

allOf:
  - $ref: gnss-common.yaml#

properties:
  compatible:
    const:
      - csr,gsd5t

  vcc-supply:
    description:
      Main voltage supply, typically connected a 1.8V supply.

  vio-supply:
    description:
      IO voltage supply, typically 1.8V

  power-gpios:
    description: An optional power GPIO line, it should be
      tagged GPIO_ACTIVE_HIGH.

  reset-gpios:
    description: An optional active low reset line, should
      be flagged with GPIO_ACTIVE_LOW.

  clocks:
    maxItems: 1

  clock-names:
    const: ref_clk

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    serial {
        gnss {
            compatible = "csr,gsd5t";
            current-speed = <115200>;

            clocks = <&gps_osc>;
            clock-names = "ref_clk";

            power-gpios = <&gpio TEGRA_GPIO(R, 6) GPIO_ACTIVE_HIGH>;

            vcc-supply = <&vcc_1v8_gps>;
            vio-supply = <&vdd_1v8_vio>;
        };
    };
